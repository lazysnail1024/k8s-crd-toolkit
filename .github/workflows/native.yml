name: Native public consumer
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toolkit-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-amd64
            cc: gcc-13
            cc_version: '13.3.0'
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: linux-arm64
            cc: gcc-13
            cc_version: '13.3.0'
          - runner: macos-15-intel
            platform: darwin/amd64
            artifact: macos-amd64
            cc: clang
            cc_version: 'Apple clang version 17.0.0'
          - runner: macos-15
            platform: darwin/arm64
            artifact: macos-arm64
            cc: clang
            cc_version: 'Apple clang version 17.0.0'
          - runner: windows-2025
            platform: windows/amd64
            artifact: windows-amd64
            cc: gcc
            cc_version: '15.2.0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: ${{ matrix.cc }}
      CGO_ENABLED: '1'
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scope CGO cache to the compiler and runner image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cache
          { "$CC" --version; printf '%s\n' "$ImageOS" "$ImageVersion"; } > artifacts/cache/compiler.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            artifacts/cache/compiler.txt
            yamlview/**/*.inc
            yamlview/**/*.h
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Build and run independent native consumer
        run: python tests/native.py --expected-platform "${{ matrix.platform }}" --cc-version "${{ matrix.cc_version }}" --source-commit "${{ github.sha }}"
      - name: Retain failure and success evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolkit-native-${{ matrix.artifact }}
          path: artifacts/native/
          if-no-files-found: error
          retention-days: 30
  index_regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc-13
      CGO_ENABLED: '1'
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scope CGO cache to the compiler and runner image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cache
          { "$CC" --version; printf '%s\n' "$ImageOS" "$ImageVersion"; } > artifacts/cache/compiler.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            artifacts/cache/compiler.txt
            yamlview/**/*.inc
            yamlview/**/*.h
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Vet public packages
        run: go vet ./...
      - name: Verify bounded query lock boundaries
        run: go test -race -count=1 ./index
      - name: Exercise concurrent public consumers with race detection
        env:
          GOFLAGS: '-race'
        run: |
          python tests/e2e.py index-race
          python tests/e2e.py workspace-race
      - name: Verify every registered mutation against a passing public baseline
        run: python tests/ablate.py
      - name: Pack regression evidence without recompressing each file
        if: always()
        shell: bash
        run: tar -I 'gzip -1' -cf "$RUNNER_TEMP/toolkit-index-regression.tar.gz" artifacts/
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolkit-index-regression
          path: ${{ runner.temp }}/toolkit-index-regression.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
  delivery_regression:
    name: Source delivery and test validity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc-13
      CGO_ENABLED: '1'
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scope CGO cache to the compiler and runner image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cache
          { "$CC" --version; printf '%s\n' "$ImageOS" "$ImageVersion"; } > artifacts/cache/compiler.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            artifacts/cache/compiler.txt
            yamlview/**/*.inc
            yamlview/**/*.h
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Reject false success, stale reports and unrelated mutation failures
        run: python tests/runner_effectiveness_e2e.py
      - name: Verify reproducible snapshot and committed checkout bytes
        run: |
          python tests/snapshot_e2e.py
          python tests/checkout_e2e.py
      - name: Verify restored vendor native inputs
        run: python tests/vendor_e2e.py
      - name: Consume an immutable module using an empty offline module cache
        shell: bash
        run: |
          set -euo pipefail
          export GOMODCACHE="$(go env GOMODCACHE)"
          python tools/snapshot.py --output artifacts/module-proxy
          python tests/delivery.py artifacts/module-proxy/manifest.json artifacts/module-proxy
          git diff --exit-code -- go.mod go.sum
      - name: Verify isolated delivery and explicit failure reasons
        run: python tests/native_delivery_e2e.py
      - name: Reject stale success after delivery infrastructure failures
        run: python tests/delivery_failures_e2e.py
      - name: Pack delivery evidence
        if: always()
        shell: bash
        run: tar -I 'gzip -1' -cf "$RUNNER_TEMP/toolkit-delivery-regression.tar.gz" artifacts/
      - name: Retain delivery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolkit-delivery-regression
          path: ${{ runner.temp }}/toolkit-delivery-regression.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
  release:
    name: Publish alpha after complete main acceptance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [consumer, index_regression, delivery_regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Release only the fully accepted main commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          if [[ ! "$version" =~ ^0\.0\.1-alpha\.[0-9]+$ ]]; then
            echo "VERSION is not an approved 0.0.1 alpha: $version" >&2
            exit 1
          fi
          tag="v${version}"
          current_main=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "Main advanced since this CI run; the newer run owns publication."
            exit 0
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release $tag remains unchanged."
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag $tag already exists without a release; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "k8s-crd-toolkit ${version}" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
