name: Native public consumer
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-amd64
            cc: gcc-13
            cc_version: '13.3.0'
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: linux-arm64
            cc: gcc-13
            cc_version: '13.3.0'
          - runner: macos-15-intel
            platform: darwin/amd64
            artifact: macos-amd64
            cc: clang
            cc_version: 'Apple clang version 17.0.0'
          - runner: macos-15
            platform: darwin/arm64
            artifact: macos-arm64
            cc: clang
            cc_version: 'Apple clang version 17.0.0'
          - runner: windows-2025
            platform: windows/amd64
            artifact: windows-amd64
            cc: gcc
            cc_version: '15.2.0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: ${{ matrix.cc }}
      CGO_ENABLED: '1'
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - name: Build and run independent native consumer
        run: python tests/native.py --expected-platform "${{ matrix.platform }}" --cc-version "${{ matrix.cc_version }}" --source-commit "${{ github.sha }}"
      - name: Retain failure and success evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolkit-native-${{ matrix.artifact }}
          path: artifacts/native/
          if-no-files-found: error
          retention-days: 30
  index_regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc-13
      CGO_ENABLED: '1'
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - name: Vet public packages
        run: go vet ./...
      - name: Exercise concurrent public consumers with race detection
        env:
          GOFLAGS: '-race'
        run: python tests/e2e.py index-race
      - name: Verify index and workspace guards with buildable ablations
        run: >-
          python tests/ablate.py
          index-ticket index-reuse index-missing index-position index-fresh index-retention
          workspace-overlay workspace-ticket workspace-discard
          workspace-coalescing workspace-fairness workspace-priority
          workspace-workqueue-fairness workspace-workqueue-followup
          workspace-membership-complete
          workspace-complete workspace-filter
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolkit-index-regression
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
